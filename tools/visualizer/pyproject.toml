[project]
name = "anycall-visualizer"
version = "0.1.0"
description = "Read-only PyQt6 dashboard for observing AnyCall traffic on Redis"
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0.0",
    "anycall-py",
    "PyQt6>=6.6",
]

[tool.uv.sources]
# Editable: the dashboard reads the protocol constants (queue prefixes, the
# heartbeat key/TTL) straight out of the library, so it has to track the lib
# source in this repo rather than a wheel built from some earlier version of it.
anycall-py = { path = "../../implementations/python/lib", editable = true }

[project.scripts]
anycall-visualizer = "visualizer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualizer"]
