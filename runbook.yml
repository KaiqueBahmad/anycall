# This file is consumed by the runbook tool: github.com/kaiquebahmad/runbook
redis:
  description: Redis broker used by every implementation
  run: docker compose up

java/supplier:
  description: Java example supplier
  run: ./run-supplier.sh
  dir: implementations/java

java/kill-supplier:
  description: Violently kill the running Java example supplier (SIGKILL, no graceful shutdown)
  run: pkill -9 -f dev.kaiquebt.anycall.example.SupplierApplication

java/consumer:
  description: Java example consumer
  run: ./run-consumer.sh
  dir: implementations/java

java/kill-consumer:
  description: Violently kill the running Java example consumer (SIGKILL, no graceful shutdown)
  run: pkill -9 -f dev.kaiquebt.anycall.example.ConsumerApplication


python/sync:
  description: Sync Python dependencies with uv
  run: uv sync
  dir: implementations/python

python/supplier:
  description: Python example supplier
  run: ./run-supplier.sh
  dir: implementations/python

python/kill-supplier:
  description: Violently kill the running Python example supplier (SIGKILL, no graceful shutdown)
  run: pkill -9 -f anycall-supplier

python/consumer:
  description: Python example consumer
  run: ./run-consumer.sh
  dir: implementations/python

python/kill-consumer:
  description: Violently kill the running Python example consumer (SIGKILL, no graceful shutdown)
  run: pkill -9 -f anycall-consumer

visualizer/sync:
  description: Sync visualizer dependencies with uv
  run: uv sync
  dir: tools/visualizer

visualizer/gui:
  description: Call visualizer tool
  run: ./run.sh
  dir: tools/visualizer
