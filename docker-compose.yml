services:
  redis:
    image: redis:7-alpine
    container_name: anycall-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - anycall

volumes:
  redis_data:

networks:
  anycall:
    driver: bridge
