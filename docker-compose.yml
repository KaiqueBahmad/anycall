services:
  redis:
    image: redis:7-alpine
    container_name: anycall-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - anycall

  java-supplier:
    build:
      context: ./java
      dockerfile: Dockerfile
      target: supplier
    container_name: anycall-java-supplier
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URI: redis://redis:6379
    networks:
      - anycall
    healthcheck:
      test: ["CMD", "cat", "/tmp/anycall/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  java-consumer:
    build:
      context: ./java
      dockerfile: Dockerfile
      target: consumer
    container_name: anycall-java-consumer
    depends_on:
      redis:
        condition: service_healthy
      java-supplier:
        condition: service_healthy
    environment:
      REDIS_URI: redis://redis:6379
    networks:
      - anycall

  python-supplier:
    build:
      context: ./python
      dockerfile: Dockerfile
      target: supplier
    container_name: anycall-python-supplier
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URI: redis://redis:6379
    networks:
      - anycall
    healthcheck:
      test: ["CMD", "cat", "/tmp/anycall/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  python-consumer:
    build:
      context: ./python
      dockerfile: Dockerfile
      target: consumer
    container_name: anycall-python-consumer
    depends_on:
      redis:
        condition: service_healthy
      python-supplier:
        condition: service_healthy
    environment:
      REDIS_URI: redis://redis:6379
    networks:
      - anycall

volumes:
  redis_data:

networks:
  anycall:
    driver: bridge
