name: GitHub Release

# Makes, or makes again, the GitHub release of a contract tag, from the tag's own sources:
# its lib and anycall-spring jars and its Python package. Publishes nothing anywhere else,
# so it's safe to run when only that step of a contract release failed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Contract tag, such as v0.10'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the tag
        run: |
          if [[ ! "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${{ inputs.tag }}' is not a contract tag (vX.Y)"
            exit 1
          fi
          echo "VERSION=${TAG_VERSION#v}.0" >> "$GITHUB_ENV"
        env:
          TAG_VERSION: ${{ inputs.tag }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build the jars
        run: |
          mkdir -p dist
          cd implementations/java/lib
          mvn -B install -DskipTests -Drevision="${VERSION}"
          cp "target/anycall-${VERSION}.jar" ../../../dist/
          # anycall-spring exists from 0.10 on
          if [[ -d ../../../integrations/spring ]]; then
            cd ../../../integrations/spring
            mvn -B package -DskipTests -Drevision="${VERSION}" -Danycall.version="${VERSION}"
            cp "target/anycall-spring-${VERSION}.jar" ../../dist/
          fi

      - name: Build the Python package
        run: |
          python -m pip install --upgrade pip build
          cd implementations/python/lib
          sed -i -E "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          python -m build --outdir ../../../dist

      - name: Make the GitHub release
        run: |
          ls dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
