name: Release Contract

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+$'  # Matches v0.1, v0.2, etc. (not v0.1.0)

jobs:
  release-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}  # Remove 'v' prefix
          echo "version=$VERSION.0" >> $GITHUB_OUTPUT
          echo "Releasing contract $VERSION.0"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up GPG
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d > ~/.gnupg/private-key.asc
          gpg --batch --import ~/.gnupg/private-key.asc
          rm ~/.gnupg/private-key.asc
          echo "GPG setup complete"

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
            http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${OSSRH_USERNAME}</username>
                <password>${OSSRH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}

      - name: Deploy Java to Maven Central
        run: |
          cd implementations/java/lib
          mvn deploy -P release \
            -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}" \
            -Dorg.slf4j.simpleLogger.defaultLogLevel=info

  release-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}  # Remove 'v' prefix
          echo "version=$VERSION.0" >> $GITHUB_OUTPUT
          echo "Releasing contract Python $VERSION.0"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build Python package
        run: |
          cd implementations/python/lib
          python -m build

      - name: Publish to PyPI
        run: |
          cd implementations/python/lib
          python -m twine upload dist/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }}
