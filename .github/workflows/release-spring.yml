name: Release Spring Patch

on:
  push:
    tags:
      - 'spring-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up GPG
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d > ~/.gnupg/private-key.asc
          gpg --batch --import ~/.gnupg/private-key.asc
          rm ~/.gnupg/private-key.asc

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
            http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${OSSRH_USERNAME}</username>
                <password>${OSSRH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}

      - name: Extract and validate release version
        run: |
          REVISION="${GITHUB_REF_NAME#spring-v}"
          if [[ ! "$REVISION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not spring-vX.Y.Z"
            exit 1
          fi
          echo "REVISION=${REVISION}" >> "$GITHUB_ENV"
          echo "CONTRACT=${REVISION%.*}" >> "$GITHUB_ENV"

      # anycall-spring brings in the newest anycall of its contract, so a patch carries the
      # library's latest fixes too.
      - name: Find the newest anycall of the contract
        run: |
          ANYCALL=$(curl -fsSL https://repo1.maven.org/maven2/dev/kaiquebt/anycall/anycall/maven-metadata.xml \
            | grep -oE "<version>${CONTRACT//./\\.}\.[0-9]+</version>" \
            | sed -E 's#</?version>##g' | sort -V | tail -1)
          if [[ -z "$ANYCALL" ]]; then
            echo "::error::No anycall ${CONTRACT}.x on Maven Central"
            exit 1
          fi
          echo "ANYCALL=${ANYCALL}" >> "$GITHUB_ENV"
          echo "anycall-spring ${REVISION} brings in anycall ${ANYCALL}"

      - name: Deploy to Maven Central
        run: |
          cd integrations/spring
          mvn -B deploy -P release \
            -Drevision="${REVISION}" \
            -Danycall.version="${ANYCALL}" \
            -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"
