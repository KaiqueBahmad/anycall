[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anycall-example-supplier"
version = "0.1.0"
description = "AnyCall Supplier Example"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kaique Bahmad", email = "kaiquebahmadt@gmail.com" }]
dependencies = [
    "anycall",
]

[project.urls]
Homepage = "https://github.com/KaiqueBahmad/anycall"
Repository = "https://github.com/KaiqueBahmad/anycall"

[project.scripts]
anycall-supplier = "example_supplier.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/example_supplier"]

[tool.uv.sources]
anycall = { workspace = true }
