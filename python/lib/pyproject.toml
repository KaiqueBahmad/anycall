[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anycall-py"
version = "0.1.0"
description = "Polyglot RPC over Redis — call functions across languages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kaique Bahmad", email = "kaiquebahmadt@gmail.com" }]
keywords = ["rpc", "redis", "polyglot", "cross-language", "microservices", "streams"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
]
dependencies = [
    "redis>=5.0.0",
    "dacite>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/KaiqueBahmad/anycall"
Repository = "https://github.com/KaiqueBahmad/anycall"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anycall"]
