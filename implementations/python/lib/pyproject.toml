[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anycall-py"
version = "0.1.3"
description = "Polyglot RPC over Redis — call functions across languages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kaique Bahmad", email = "kaiquebahmadt@gmail.com" }]
keywords = ["rpc", "redis", "polyglot", "cross-language", "microservices", "streams"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications",
]
dependencies = [
    "redis>=5.0.0",
    "dacite>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/KaiqueBahmad/anycall"
Repository = "https://github.com/KaiqueBahmad/anycall"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anycall"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
]
